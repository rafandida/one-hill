<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tank Wars — play</title>
    <meta name="description" content="Turn-based VGA artillery in your browser. Angle, power, wind, and one good shot." />
    <meta property="og:title" content="Tank Wars — you're invited to the hill" />
    <meta property="og:description" content="Turn-based VGA artillery for 1–4 players. Free, in your browser." />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header id="bar">
      <a id="home" href="./">◄ <span class="bar-wide">EXIT TO </span>HOME</a>
      <button id="full" type="button" aria-pressed="false" hidden>FULL SCREEN</button>
    </header>
    <div id="monitor">
      <canvas id="game" width="640" height="400" aria-label="Tank Wars game"></canvas>
    </div>
    <p id="hint">
      Click a weapon on the bottom bar, or press 1–6. Drag to aim, click to fire. M mute.
      Pick ONLINE on the title screen to play friends with an invite code.
      <a href="./">Tank Wars home</a>
    </p>
    <script src="js/net.js"></script>
    <script src="js/game.js"></script>
  </body>
</html>
