<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Google tag (gtag.js). Skipped for ?demo, the attract-mode game the front page
         embeds, so a front-page visit doesn't also count as a game-page view. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      if (!/[?&]demo\b/.test(location.search)) {
        const tag = document.createElement("script");
        tag.async = true;
        tag.src = "https://www.googletagmanager.com/gtag/js?id=G-55PL2Q7BF8";
        document.head.appendChild(tag);
        gtag("js", new Date());
        gtag("config", "G-55PL2Q7BF8");
      }
    </script>
    <title>Play One Hill — Tank Artillery vs CPU, Hotseat or Online</title>
    <meta
      name="description"
      content="Jump straight into One Hill: aim, set the power, read the wind and fire. Play the CPU, pass the keyboard, or host an online room with a five-letter code."
    />
    <link rel="canonical" href="https://onehill.app/play.html" />
    <meta name="robots" content="index, follow, max-image-preview:large" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="One Hill" />
    <meta property="og:url" content="https://onehill.app/play.html" />
    <meta property="og:title" content="One Hill — you're invited to the hill" />
    <meta property="og:description" content="Turn-based tank artillery for 1–4 players. Free, in your browser. Open the link to join the room." />
    <meta property="og:image" content="https://onehill.app/img/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The ONE HILL logo over a night sky, with two tanks on a hill. A Tank Wars tribute." />
    <meta property="og:locale" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />

    <meta name="theme-color" content="#000000" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="img/icon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="img/apple-touch-icon.png" />
    <link rel="manifest" href="site.webmanifest" />
    <script src="js/era.js"></script>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <h1 class="sr-only">Play One Hill, a Tank Wars tribute</h1>
    <noscript><p class="noscript">One Hill runs in your browser and needs JavaScript turned on.</p></noscript>
    <header id="bar">
      <a id="home" href="./">◄ <span class="bar-wide">EXIT TO </span>HOME</a>
      <div class="era-switch" role="group" aria-label="Era">
        <button type="button" data-era-pick="1990" aria-pressed="true">1990</button>
        <button type="button" data-era-pick="2026" aria-pressed="false">2026</button>
      </div>
      <button id="full" type="button" aria-pressed="false" hidden>FULL SCREEN</button>
    </header>
    <div id="monitor">
      <canvas id="game" width="640" height="400" aria-label="One Hill game"></canvas>
    </div>
    <p id="hint">
      Click a weapon on the bottom bar, or press 1–6. Drag to aim, click to fire. M mute.
      Pick ONLINE on the title screen to play friends with an invite code.
      <a href="./">One Hill home</a>
    </p>
    <script src="js/net.js"></script>
    <script src="js/game.js"></script>
  </body>
</html>
